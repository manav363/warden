# Local dev stack. Credentials are dev-only and match .env.example.
# All ports bind to 127.0.0.1: the Vault root token and MinIO creds must never reach the LAN.
# Host ports for postgres/redis are overridable if you run them natively, e.g.
#   WARDEN_PG_PORT=5433 WARDEN_REDIS_PORT=6380 make up
name: warden

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: warden
      POSTGRES_DB: warden
    ports: ["127.0.0.1:${WARDEN_PG_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warden"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:${WARDEN_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  nats:
    image: nats:2.15-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: [nats-data:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      retries: 10

  minio:
    # Official minio/minio images are no longer publicly pullable; see docs/adr/0003-object-storage.md.
    image: chainguard/minio:latest-dev@sha256:d7c906993247627c19f37fc1fa302c34cf2d209ae0e7dc7d52fb0be6ac2849ba
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: warden
      MINIO_ROOT_PASSWORD: warden-dev-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.21.4
    command: ["server", "-dev"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add: [IPC_LOCK]
    ports: ["127.0.0.1:8200:8200"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ../services/api
      dockerfile: ../../deploy/docker/api.Dockerfile
    environment:
      WARDEN_ENV: dev
      WARDEN_LOG_LEVEL: info
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
  nats-data:
  minio-data:
